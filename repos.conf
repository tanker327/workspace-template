# repos.conf - the list of project repos in this workspace.
#
# Format: git-config (the same format as .gitmodules). It is read and written
# with `git config -f repos.conf`, so no parser other than git is needed.
# Prefer `ws add` / `ws remove` over editing by hand. Reference: docs/04-manifest.md
#
# Keys per repo:
#   url   (required)  git clone URL
#   tags  (optional)  comma-separated labels, used by `--tag` filters
#   desc  (optional)  one line shown to agents in the CLAUDE.md repo index
#   path  (optional)  clone location, a relative path under repos/
#                     (default: repos/<name>)
#
# Example. Remove the leading "; " to enable, or run:
#   ws add orders-api git@github.com:YOUR-USER/orders-api.git --tags shop,service \
#          --desc "Order service. Owns the orders schema"
#
; [repo "orders-api"]
;     url = git@github.com:YOUR-USER/orders-api.git
;     tags = shop,service
;     desc = Order service. Owns the orders schema
;
; [repo "storefront"]
;     url = git@github.com:YOUR-USER/storefront.git
;     tags = shop,web
;     desc = Web shop front end. Calls orders-api
